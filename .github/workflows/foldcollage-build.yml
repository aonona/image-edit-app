name: Build FoldCollage APK

on:
  pull_request:
    branches: [ main ]
  push:
    branches:
      - chatgpt/foldcollage-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble generated source
        run: |
          mkdir -p foldcollage/app/src/main/java/com/aonon/foldcollage
          cat foldcollage/srcparts/CollageView.java.part1 \
              foldcollage/srcparts/CollageView.java.part2 \
              foldcollage/srcparts/CollageView.java.part3 \
              > foldcollage/app/src/main/java/com/aonon/foldcollage/CollageView.java

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: foldcollage
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FoldCollage-debug-apk
          path: foldcollage/app/build/outputs/apk/debug/app-debug.apk
